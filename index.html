<!DOCTYPE html>
<html>
<head>
    <title>Smart Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Smart Store</h1>
</header>

<div class="container">

    <div class="product">
        <img src="https://picsum.photos/200?1" loading="lazy">
        <h3>Laptop</h3>
        <p>₹50,000</p>
        <button onclick="addToCart('Laptop')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/200?2" loading="lazy">
        <h3>Mobile</h3>
        <p>₹20,000</p>
        <button onclick="addToCart('Mobile')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/200?3" loading="lazy">
        <h3>Headphones</h3>
        <p>₹2,000</p>
        <button onclick="addToCart('Headphones')">
            Add to Cart
        </button>
    </div>

</div>

<h2>Cart</h2>
<ul id="cart"></ul>

<script src="script.js"></script>

</body>
</html>
